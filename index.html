<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interpolation Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>
  <canvas id="particles"></canvas>

  <main class="app">
    <header class="hero">
      <p class="badge">Polynomial Interpolation • Lagrange</p>
      <h1>Interpolation</h1>
      <p class="subtitle">
        輸入完整數列，直接生成穿過每個數值的拉格朗日插值多項式。
      </p>
    </header>

    <section class="panel controls">
      <h2>輸入設定</h2>
      <div class="grid">
        <label>
          完整數列（以逗號分隔）
          <input id="sequenceInput" type="text" value="1,3,5,7" autocomplete="off" spellcheck="false" />
        </label>
      </div>
      <div class="actions">
        <button id="applyBtn">生成公式</button>
        <button id="randomBtn" class="ghost" type="button">隨機新增一項</button>
        <button id="shareBtn" class="ghost" type="button">複製參數連結</button>
      </div>
      <p class="tip">提示：輸入 1,3,5,7，依序對應點 (1,1)、(2,3)、(3,5)、(4,7)。</p>
      <p class="tip">網址只需 <code>?sequence=1,3,5,7</code>，就會自動載入整個數列。</p>
      <p id="shareStatus" class="tip" role="status" aria-live="polite"></p>
    </section>

    <section class="panel result">
      <h2>插值結果</h2>
      <div id="pointsText" class="card"></div>
      <div id="formulaText" class="card formula"></div>
      <div id="polyText" class="card"></div>
      <div id="valueText" class="card"></div>
    </section>

    <section class="panel chart-panel">
      <h2>曲線預覽</h2>
      <div class="chart-layout">
        <canvas id="plot" width="960" height="420"></canvas>
        <img class="side-image" src="./unnamed-removebg-preview.png" alt="Interpolation 視覺素材" />
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
